server:
  port: 8004
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100

spring:
  application:
    name: api-service
  datasource:
    url: jdbc:mysql://100.101.92.2:3306/ink_sms_gateway?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cloud:
    nacos:
      discovery:
        namespace: public
        group: DEFAULT_GROUP
      config:
        enabled: false
        import-check:
          enabled: false

# CMPP 下游服务器配置（接受 SP 连接）
# 上游连接配置已从数据库 ink_channel 表加载，不再使用 YAML 配置
cmpp:
  server:
    port: 7891
    allowed-sp-list: "test:123456"
    boss-threads: 1
    worker-threads: 4
  # 退订策略：上行命中关键字时登记通道级黑名单
  unsubscribe:
    # 退订关键字集合（逗号分隔，trim+忽略大小写精确匹配）
    keywords: R,RD,TD,T,N,退订,0000
    # 黑名单过期天数（惰性过期）
    blacklist-expire-days: 180
  # 限流配置：SP 限速值按客户配置（ink_sp.rate_limit）
  rate-limit:
    # REST 入口单 IP 每秒发送上限（0-不限制）
    ip-per-second: 10

# 日志配置
logging:
  charset:
    console: UTF-8
    file: UTF-8

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 每日定时短信配置
ink:
  daily-sms:
    enabled: true
    cron: "0 0 9 * * ?"
    min-count: 5000
    max-count: 20000
    sp-id: "testsp01"
    src-id-prefix: "10690700"
    dest-phones:
      - 18545654350
      - 19223308450
      - 13164564350
      - 18846936654
    templates:
      - "【墨轩科技】今日天气晴好，注意防晒，退订回复R"
      - "【墨轩科技】您的验证码是${random}，5分钟内有效，请勿泄露"
