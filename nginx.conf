# ============================================================
# INK SMS Gateway - Nginx Configuration
# 将此文件复制到 /etc/nginx/conf.d/ink-sms.conf 并执行 nginx -s reload
# ============================================================

server {
    listen       80;
    server_name  _;          # 按实际域名修改

    # 前端静态资源
    root   /opt/ink-sms/web;
    index  index.html;

    # Vue Router history 模式：所有前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理 → Gateway (8080)
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
    }

    # Knife4j / Swagger UI 代理（可选，生产环境可注释掉）
    location /doc.html {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
    }
    location /swagger-resources {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
    }
    location /v3/api-docs {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    access_log  /var/log/nginx/ink-sms-access.log;
    error_log   /var/log/nginx/ink-sms-error.log;
}
